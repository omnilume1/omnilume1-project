<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050307">
<meta name="robots" content="noindex">
<title>Offline | OmniLume</title>
<style>
  html { height: 100%; background: #050307; color-scheme: dark; }
  body { display: grid; min-height: 100%; margin: 0; place-items: center; padding: 24px; box-sizing: border-box; color: #f3f0fa; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.5; text-align: center; -webkit-font-smoothing: antialiased; }
  main { max-width: 320px; }
  svg { display: block; width: 72px; height: 72px; margin: 0 auto 28px; }
  h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
  p { margin: 10px 0 0; color: #a39cb8; font-size: 15px; }
  button { height: 44px; margin-top: 28px; padding: 0 22px; border: 1px solid rgba(241, 239, 255, .17); border-radius: 12px; background: rgba(241, 239, 255, .06); color: inherit; font: inherit; font-size: 14px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid #b9a8ff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="r" gradientUnits="userSpaceOnUse" x1="16" y1="48" x2="48" y2="16"><stop offset="0" stop-color="#4b31d4"/><stop offset=".55" stop-color="#8f78ff"/><stop offset="1" stop-color="#e8e1ff"/></linearGradient>
      <radialGradient id="g"><stop offset="0" stop-color="#ece6ff" stop-opacity=".95"/><stop offset=".45" stop-color="#b9a8ff" stop-opacity=".45"/><stop offset="1" stop-color="#b9a8ff" stop-opacity="0"/></radialGradient>
    </defs>
    <path d="M48.59 28.29 A17 17 0 1 1 35.71 15.41" fill="none" stroke="url(#r)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="44.02" cy="19.98" r="8" fill="url(#g)"/>
    <circle cx="44.02" cy="19.98" r="3.6" fill="#fff"/>
  </svg>
  <h1>You're offline.</h1>
  <p>Reconnect to get back to your room.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
